name: Fork Release Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or SHA to build."
        required: true
        default: "feature/persistent-energy-history"
        type: string
      release_tag:
        description: "Release tag. Leave empty to use fork-build-<run number>."
        required: false
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - generic_esp32s3_usb_16mb_energy_history_psram
          - generic_esp32s3_usb

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio setuptools

      - name: Enable Corepack
        run: |
          cd webapp
          corepack enable

      - name: Setup Node.js and yarn
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: "webapp/yarn.lock"

      - name: Install WebApp dependencies
        run: |
          cd webapp
          yarn install --frozen-lockfile

      - name: Build WebApp
        run: |
          cd webapp
          yarn build

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Rename firmware
        run: |
          mv .pio/build/${{ matrix.environment }}/firmware.bin .pio/build/${{ matrix.environment }}/opendtu-${{ matrix.environment }}.bin
          mv .pio/build/${{ matrix.environment }}/firmware.factory.bin .pio/build/${{ matrix.environment }}/opendtu-${{ matrix.environment }}.factory.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: opendtu-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/opendtu-${{ matrix.environment }}.bin
            .pio/build/${{ matrix.environment }}/opendtu-${{ matrix.environment }}.factory.bin

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            echo "tag=$RELEASE_TAG_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "tag=fork-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "opendtu-*.bin" -exec cp {} release-assets/ \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ inputs.source_ref }}
          body: |
            Source ref: ${{ inputs.source_ref }}

            Firmware build for:
            - generic_esp32s3_usb_16mb_energy_history_psram
            - generic_esp32s3_usb
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: release-assets/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
